# Lidogram: Telegram lead mini-CRM (docs/deployment.md).
#   web (Next.js) -> 127.0.0.1:3700   docker compose -p lidogram -f /opt/lidogram/compose.prod.yml
#
# The listen lines are exactly `listen 80;` and `listen 443 ssl;`, as in the other vhosts here. Never
# add [::], an IP address, default_server, reuseport or http2: each one creates or redefines a socket
# that every vhost shares. nginx 1.24 has no `http2 on;`, and `listen 443 ssl http2` would be one
# more "protocol options redefined" warning.

server {
    listen 443 ssl;
    server_name lidogram.72-56-101-176.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/lidogram.72-56-101-176.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidogram.72-56-101-176.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lidogram.access.log;
    error_log  /var/log/nginx/lidogram.error.log;

    client_max_body_size 2m;
    # HSTS is set here: next.config.ts leaves it to the TLS-terminating proxy.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        # A copilot draft calls OpenAI: about 40 s in the worst case.
        proxy_read_timeout 90s;
        # Next.js checks that a Server Action's Origin matches the forwarded host. Without these
        # headers every form in the CRM fails with "Invalid Server Actions request".
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The login rate limit keys on X-Real-IP: always overwrite whatever the client sent.
        proxy_set_header X-Real-IP         $remote_addr;
    }
}

server {
    listen 80;
    server_name lidogram.72-56-101-176.sslip.io;

    access_log /var/log/nginx/lidogram.access.log;
    error_log  /var/log/nginx/lidogram.error.log;

    # Renewal must keep working over plain HTTP, so the ACME path is served rather than redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}
