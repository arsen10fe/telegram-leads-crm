# Lidogram: bootstrap vhost, used only until the certificate exists (docs/deployment.md).
# Port 80 only: serves the ACME challenge for certbot's webroot and 404 for everything else.
# It listens exactly like the other vhosts here: never [::], an IP address, default_server or reuseport.
server {
    listen 80;
    server_name lidogram.72-56-101-176.sslip.io;

    access_log /var/log/nginx/lidogram.access.log;
    error_log  /var/log/nginx/lidogram.error.log;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 404; }
}
