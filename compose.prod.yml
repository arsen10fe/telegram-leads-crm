# Production: self-contained, host-agnostic. One image, four services (+ optional Caddy).
#   docker compose -f compose.prod.yml up -d --build                  # behind the host's own nginx
#   docker compose -f compose.prod.yml --profile edge up -d --build   # with Caddy and automatic TLS
# Secrets and settings come from .env (see the production section of .env.example).
name: lidogram

x-app: &app
  build: .
  image: lidogram:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    NODE_ENV: production
    TZ: Europe/Moscow
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot: schema migrations, then the create-only seed (never overwrites CRM edits).
  migrate:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    <<: *app
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  # The only consumer of Telegram updates for this token (long polling) + the job runner.
  bot:
    <<: *app
    command: ["npx", "tsx", "src/worker/main.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  # Optional edge proxy with automatic Let's Encrypt TLS. Caddy forwards the Host header,
  # so Server Actions pass Next.js's Origin check.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pg-data:
  caddy-data:
  caddy-config:
